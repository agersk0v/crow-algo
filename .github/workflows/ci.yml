name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: postgres
          # Disposable CI service only; not a deployment credential.
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CROW_TEST_ADMIN_URL: postgresql+psycopg://postgres:ci-only-ephemeral@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.23
      - name: Install dependencies
        run: uv --directory backend sync --locked
      - name: Lint
        run: uv --directory backend run --locked ruff check --config pyproject.toml . ../scripts
      - name: Check formatting
        run: uv --directory backend run --locked ruff format --config pyproject.toml --check . ../scripts
      - name: Type check
        run: uv --directory backend run --locked mypy
      - name: Test
        run: uv --directory backend run --locked pytest --require-postgres
      - name: Build and start disposable Compose installation
        env:
          CROW_API_PORT: "18004"
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          path = Path('.env')
          path.write_text('CROW_DB_PASSWORD=' + secrets.token_hex(32) + '\n')
          path.chmod(0o600)
          PY
          docker compose -p crow-test-ci config --quiet
          docker compose -p crow-test-ci up -d --build --wait --wait-timeout 90
      - name: Verify Compose recovery and persistence
        env:
          CROW_API_PORT: "18004"
          CROW_COMPOSE_TEST_PROJECT: crow-test-ci
        run: python scripts/smoke.py
      - name: Collect Compose logs
        if: failure()
        run: if [ -f .env ]; then docker compose -p crow-test-ci logs --no-color --tail=100; fi
      - name: Remove disposable Compose installation
        if: always()
        run: if [ -f .env ]; then docker compose -p crow-test-ci down --volumes; fi
