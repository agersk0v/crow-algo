[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "crow-algo"
version = "0.1.0"
description = "Typed configuration and contracts for a crypto spot-trading bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.12.3",
    "SQLAlchemy==2.0.44",
    "psycopg[binary]==3.2.12",
    "alembic==1.17.1",
    "fastapi==0.121.1",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["mypy==1.19.1", "pytest==9.0.2", "ruff==0.14.14", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/crow_algo"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["integration: requires an isolated PostgreSQL database"]
